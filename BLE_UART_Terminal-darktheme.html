<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE UART Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg:        #0e140e;
    --panel:     #141e16;
    --border:    #2e4d2e;
    --green:     #3dff6e;
    --green-dim: #28c750;
    --green-glow:#3dff6e44;
    --rx-text:   #c4ffd6;
    --amber:     #ffeb99;
    --red:       #ff9090;
    --text:      #e8ffe8;
    --text-dim:  #bce4bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 72%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
    z-index: 999;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #162616 0%, var(--bg) 100%);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--green);
    text-shadow: 0 0 10px var(--green), 0 0 20px var(--green-glow);
    letter-spacing: 0.15em;
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.8rem;
    display: block;
    letter-spacing: 0.2em;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.3s;
  }
  .dot.connected {
    background: var(--green);
    box-shadow: 0 0 6px var(--green), 0 0 12px var(--green);
    animation: pulse 2s infinite;
  }
  .dot.connecting {
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
    animation: blink 0.5s infinite;
  }
  .dot.error {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  #device-name {
    color: var(--green);
    text-shadow: 0 0 6px var(--green-glow);
  }

  main {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 12px 16px;
    gap: 10px;
    overflow: hidden;
  }

  /* Control strip */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  button {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    opacity: 0;
    transition: opacity 0.15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--green-dim);
    color: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
  }
  button:active:not(:disabled)::after { opacity: 0.08; }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #btn-toggle {
    border-color: var(--green-dim);
    color: var(--green);
    box-shadow: 0 0 6px var(--green-glow);
  }
  #btn-toggle.connected {
    border-color: #8a2a2a;
    color: #ff7777;
  }
  #btn-toggle.connected:hover {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 8px rgba(255,50,50,0.3);
  }
  #btn-clear {
    margin-left: auto;
  }

  .separator {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .options {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  select, .options label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  select:focus { outline: none; border-color: var(--green-dim); }

  .options label {
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .options input[type=checkbox] {
    accent-color: var(--green);
    width: 15px; height: 15px;
    cursor: pointer;
  }

  /* Terminal output */
  .terminal-wrapper {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .terminal-wrapper::before {
    content: 'OUTPUT';
    position: absolute;
    top: -1px;
    left: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    background: var(--panel);
    padding: 0 6px;
    z-index: 1;
  }

  #terminal {
    height: 100%;
    overflow-y: auto;
    padding: 18px 12px 12px;
    scroll-behavior: smooth;
    font-size: 0.95rem;
    line-height: 1.55;
  }

  #terminal::-webkit-scrollbar { width: 6px; }
  #terminal::-webkit-scrollbar-track { background: var(--bg); }
  #terminal::-webkit-scrollbar-thumb { background: var(--border); }
  #terminal::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

  .line {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 1px 0;
    animation: fadein 0.1s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

  .line .ts {
    color: var(--text-dim);
    font-size: 0.8rem;
    flex-shrink: 0;
    user-select: none;
  }
  .line .ts:empty { display: none; }
  .line .dir {
    font-size: 0.8rem;
    font-weight: bold;
    flex-shrink: 0;
    width: 22px;
    text-align: center;
  }
  #terminal.hide-dir .line .dir { display: none; }
  .line.rx .dir { color: var(--green); text-shadow: 0 0 6px var(--green); }
  .line.tx .dir { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .line.sys .dir { color: var(--text-dim); }
  .line.ok .dir { color: var(--green); text-shadow: 0 0 6px var(--green); }
  .line .msg { white-space: pre-wrap; word-break: break-word; }
  .line.rx .msg { color: var(--rx-text); text-shadow: 0 0 4px var(--green-glow); }
  .line.tx .msg, .line .tx-inline { color: var(--amber); }
  .line.sys .msg { color: var(--text-dim); font-style: italic; }
  .line.ok {
    margin: 4px 0;
    padding: 4px 8px;
    border-left: 3px solid var(--green);
    background: rgba(61, 255, 110, 0.08);
  }
  .line.ok .msg {
    color: var(--green);
    font-weight: bold;
    text-shadow: 0 0 6px var(--green-glow);
  }
  .line.err .msg { color: var(--red); }

  /* Input row */
  .input-row {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 4px 8px;
    align-items: center;
    position: relative;
  }

  .input-row::before {
    content: 'TX';
    font-size: 0.72rem;
    color: var(--amber);
    letter-spacing: 0.15em;
    text-shadow: 0 0 6px var(--amber);
    flex-shrink: 0;
  }

  #tx-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    color: var(--amber);
    caret-color: var(--amber);
    padding: 5px;
    letter-spacing: 0.05em;
  }
  #tx-input::placeholder { color: #6a8a6a; }
  #tx-input:disabled { opacity: 0.45; }

  #tx-input:focus ~ .cursor-blink { display: none; }

  #btn-send {
    border-color: #8a6d1a;
    color: var(--amber);
    padding: 7px 22px;
  }
  #btn-send:hover:not(:disabled) {
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 8px rgba(255,179,0,0.3);
  }

  /* Quick-send presets */
  .presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .preset-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    align-self: center;
    text-transform: uppercase;
  }
  .preset-btn {
    font-size: 0.78rem;
    padding: 5px 12px;
    border-color: var(--border);
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    flex-shrink: 0;
    padding: 4px 2px;
  }
  .stats span { color: var(--green-dim); }

  /* Not-supported message */
  #no-ble {
    display: none;
    text-align: center;
    padding: 40px;
    color: var(--red);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    BLE UART TERMINAL
    <br><a href="https://github.com/ednieuw/HTML-BLEserial" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; font-size: 60%;">EdSoft @2026 V1.2</a>
  </div>
  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">DISCONNECTED</span>
    </div>
    <div class="separator"></div>
    <span id="device-name">—</span>
  </div>
</header>

<main>
  <div id="no-ble">⚠ Web Bluetooth not supported in this browser.<br>Use Chrome or Edge on desktop/Android.</div>

  <div class="controls">
    <button id="btn-toggle">⬡ CONNECT</button>
    <div class="separator"></div>
    <div class="options">
      <label><input type="checkbox" id="opt-timestamp"> TIMESTAMP</label>
      <label><input type="checkbox" id="opt-autoscroll" checked> AUTOSCROLL</label>
      <label><input type="checkbox" id="opt-dir"> ARROWS</label>
      <select id="opt-newline">
        <option value="crlf">CR+LF</option>
        <option value="lf">LF</option>
        <option value="cr">CR</option>
        <option value="none">NONE</option>
      </select>
      <select id="opt-display">
        <option value="ascii">ASCII</option>
        <option value="hex">HEX</option>
        <option value="both">BOTH</option>
      </select>
    </div>
    <button id="btn-clear">CLR</button>
  </div>

  <div class="presets">
    <span class="preset-label">QUICK:</span>
    <button class="preset-btn" data-cmd="I">INFO</button>
    <button class="preset-btn" data-cmd="T">TIME?</button>
    <button class="preset-btn" data-cmd="S">SYNC</button>
    <button class="preset-btn" data-cmd="R">RESET</button>
    <button class="preset-btn" data-cmd="D">DEBUG</button>
    <button class="preset-btn" data-cmd="H">HELP</button>
  </div>

  <div class="terminal-wrapper">
    <div id="terminal" class="hide-dir"></div>
  </div>

  <div class="input-row">
    <input type="text" id="tx-input" placeholder="type command and press ENTER or SEND…" disabled autocomplete="off" spellcheck="false">
    <button id="btn-send" disabled>SEND ↵</button>
  </div>

  <div class="stats">
    RX: <span id="stat-rx">0</span> bytes &nbsp;|&nbsp;
    TX: <span id="stat-tx">0</span> bytes &nbsp;|&nbsp;
    MSGS: <span id="stat-msgs">0</span> &nbsp;|&nbsp;
    <span id="stat-service">SERVICE: —</span>
  </div>
</main>

<script>
// ─── Nordic UART Service UUIDs ───────────────────────────────────────────────
const UART_SERVICE_UUID     = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_TX_CHAR_UUID     = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // write (host→device)
const UART_RX_CHAR_UUID     = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notify (device→host)

// ─── State ───────────────────────────────────────────────────────────────────
let device = null, server = null, txChar = null, rxChar = null;
let rxBytes = 0, txBytes = 0, msgCount = 0;
let currentRxMsg = null;
let lastRxWasCR = false;
let isConnecting = false;
let txQueue = Promise.resolve();
const history = [];
let histIdx = -1;

// ─── DOM ─────────────────────────────────────────────────────────────────────
const terminal   = document.getElementById('terminal');
const txInput    = document.getElementById('tx-input');
const btnToggle  = document.getElementById('btn-toggle');
const btnSend    = document.getElementById('btn-send');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const deviceName = document.getElementById('device-name');
const statRx     = document.getElementById('stat-rx');
const statTx     = document.getElementById('stat-tx');
const statMsgs   = document.getElementById('stat-msgs');
const statSvc    = document.getElementById('stat-service');
const optTS      = document.getElementById('opt-timestamp');
const optScroll  = document.getElementById('opt-autoscroll');
const optDir     = document.getElementById('opt-dir');
const optNL      = document.getElementById('opt-newline');
const optDisp    = document.getElementById('opt-display');
const noBle      = document.getElementById('no-ble');

// ─── Check Web Bluetooth ─────────────────────────────────────────────────────
if (!navigator.bluetooth) {
  noBle.style.display = 'block';
  btnToggle.disabled = true;
}

// ─── Logging ─────────────────────────────────────────────────────────────────
function ts() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0')}`;
}

function toHexStr(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}

function log(text, type = 'sys') {
  currentRxMsg = null;
  const line = document.createElement('div');
  line.className = `line ${type}`;

  const tsEl = document.createElement('span');
  tsEl.className = 'ts';
  tsEl.textContent = optTS.checked ? ts() : '';

  const dir = document.createElement('span');
  dir.className = 'dir';
  dir.textContent = type === 'rx' ? '◀' : type === 'tx' ? '▶' : type === 'err' ? '✕' : type === 'ok' ? '✓' : '·';

  const msg = document.createElement('span');
  msg.className = 'msg';
  msg.textContent = text;

  line.append(tsEl, dir, msg);
  terminal.appendChild(line);
  msgCount++;
  statMsgs.textContent = msgCount;

  if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
  return msg;
}

function syslog(msg) { log(msg, 'sys'); }
function errlog(msg) { log(msg, 'err'); }

// ─── Connect ─────────────────────────────────────────────────────────────────
async function connect() {
  if (isConnecting) return;
  isConnecting = true;
  btnToggle.disabled = true;
  try {
    setStatus('connecting');
    syslog('Scanning for BLE UART devices…');

    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UART_SERVICE_UUID] }],
      optionalServices: [UART_SERVICE_UUID],
      // Skip OS pairing dialog where possible
    });
    // Chrome reuses the same BluetoothDevice instance across reconnects; strip any stale listener
    dev.removeEventListener('gattserverdisconnected', onDisconnected);
    device = dev;

    syslog(`Found: ${dev.name || 'Unknown'}`);

    // Windows BLE often drops the first GATT connect or service discovery — retry full setup up to 3x
    let retries = 3;
    while (retries--) {
      try {
        server = await dev.gatt.connect();
        syslog('GATT connected, discovering services…');

        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        statSvc.textContent = `SERVICE: NUS`;

        txChar = await service.getCharacteristic(UART_TX_CHAR_UUID);
        rxChar = await service.getCharacteristic(UART_RX_CHAR_UUID);

        rxChar.removeEventListener('characteristicvaluechanged', onRx);
        await rxChar.startNotifications();
        rxChar.addEventListener('characteristicvaluechanged', onRx);
        break;
      } catch (e) {
        if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
        if (dev.gatt && dev.gatt.connected) {
          dev.gatt.disconnect();
        }
        server = null; txChar = null; rxChar = null;
        if (retries === 0) throw e;
        syslog(`GATT setup failed, retrying… (${retries} left)`);
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    dev.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('connected', dev.name || 'Unknown');
    log(`Connected to [${dev.name || 'Unknown'}] — ready.`, 'ok');
    enableUI(true);

  } catch (err) {
    if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
    if (device && device.gatt && device.gatt.connected) {
      device.gatt.disconnect();
    }
    device = null; server = null; txChar = null; rxChar = null;
    statSvc.textContent = 'SERVICE: —';
    setStatus('disconnected');
    enableUI(false);
    if (err.name !== 'NotFoundError') errlog(`Connect failed: ${err.message}`);
    else syslog('Scan cancelled.');
  } finally {
    isConnecting = false;
    btnToggle.disabled = false;
    if (!txChar) btnToggle.focus();
  }
}

// ─── Disconnect ──────────────────────────────────────────────────────────────
function disconnect() {
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

function onDisconnected(event) {
  if (event && event.target) {
    event.target.removeEventListener('gattserverdisconnected', onDisconnected);
  }
  if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
  currentRxMsg = null;
  lastRxWasCR = false;
  statSvc.textContent = 'SERVICE: —';
  setStatus('disconnected');
  enableUI(false);
  syslog('Device disconnected.');
  device = null; server = null; txChar = null; rxChar = null;
}

// ─── RX ──────────────────────────────────────────────────────────────────────
function onRx(event) {
  const value = event.target.value;
  const bytes = new Uint8Array(value.buffer);
  rxBytes += bytes.length;
  statRx.textContent = rxBytes;

  let text = new TextDecoder().decode(bytes);
  const disp = optDisp.value;

  if (disp === 'hex') {
    log(toHexStr(bytes), 'rx');
  } else if (disp === 'both') {
    log(`${text.replace(/[\r\n]+/g, '↵')}  [${toHexStr(bytes)}]`, 'rx');
  } else {
    if (lastRxWasCR && text.startsWith('\n')) text = text.slice(1);
    lastRxWasCR = text.endsWith('\r');
    const parts = text.replace(/\r\n?/g, '\n').split('\n');
    parts.forEach((part, idx) => {
      if (idx > 0) {
        if (currentRxMsg === null) log('', 'rx');
        currentRxMsg = null;
      }
      if (part.length) {
        if (currentRxMsg) {
          currentRxMsg.textContent += part;
        } else {
          currentRxMsg = log(part, 'rx');
        }
      }
    });
    if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
  }
}

// ─── TX ──────────────────────────────────────────────────────────────────────
function send(text) {
  const run = txQueue.then(() => sendNow(text));
  txQueue = run.catch(() => false);
  return run;
}

async function sendNow(text) {
  if (!txChar) { errlog('Not connected.'); return false; }

  let payload = text;
  if (optNL.value === 'crlf') payload += '\r\n';
  else if (optNL.value === 'lf') payload += '\n';
  else if (optNL.value === 'cr') payload += '\r';
  if (!payload.length) return true;

  const encoded = new TextEncoder().encode(payload);

  // Split into 20-byte MTU-safe chunks
  try {
    for (let i = 0; i < encoded.length; i += 20) {
      await txChar.writeValue(encoded.slice(i, i + 20));
    }
    txBytes += encoded.length;
    statTx.textContent = txBytes;

    if (text.length) {
      if (currentRxMsg) {
        const txSpan = document.createElement('span');
        txSpan.className = 'tx-inline';
        txSpan.textContent = text;
        currentRxMsg.appendChild(txSpan);
        if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
      } else {
        log(text, 'tx');
      }
    }
    currentRxMsg = null;

    // History
    if (text.length && history[0] !== text) history.unshift(text);
    if (history.length > 50) history.pop();
    histIdx = -1;
    return true;
  } catch (err) {
    errlog(`Send failed: ${err.message}`);
    return false;
  }
}

// ─── UI helpers ─────────────────────────────────────────────────────────────
function setStatus(state, name = '—') {
  statusDot.className = `dot ${state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : ''}`;
  statusText.textContent = state.toUpperCase();
  deviceName.textContent = state === 'connected' ? name : '—';
}

function enableUI(connected) {
  btnToggle.textContent = connected ? '✕ DISCONNECT' : '⬡ CONNECT';
  btnToggle.classList.toggle('connected', connected);
  txInput.disabled = !connected;
  btnSend.disabled = !connected;
  document.querySelectorAll('.preset-btn').forEach(b => b.disabled = !connected);
  if (connected) txInput.focus();
  else if (!btnToggle.disabled) btnToggle.focus();
}

// ─── Events ──────────────────────────────────────────────────────────────────
btnToggle.addEventListener('click', () => {
  if (device && device.gatt && device.gatt.connected) disconnect();
  else connect();
});
btnSend.addEventListener('click', () => {
  send(txInput.value);
  txInput.value = '';
});

txInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    send(txInput.value);
    txInput.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) {
      histIdx++;
      txInput.value = history[histIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; txInput.value = history[histIdx]; }
    else if (histIdx === 0) { histIdx = -1; txInput.value = ''; }
  }
});

txInput.addEventListener('paste', async e => {
  const text = e.clipboardData && e.clipboardData.getData('text');
  if (!text || !/[\r\n]/.test(text)) return;
  e.preventDefault();
  if (!txChar) { errlog('Not connected.'); return; }
  const lines = text.split(/\r\n|\n|\r/);
  const hasTrailingNL = lines.length > 1 && lines[lines.length - 1] === '';
  if (hasTrailingNL) lines.pop();
  const start = txInput.selectionStart ?? txInput.value.length;
  const end = txInput.selectionEnd ?? txInput.value.length;
  const before = txInput.value.slice(0, start);
  const after = txInput.value.slice(end);
  lines[0] = before + lines[0];
  if (hasTrailingNL) {
    txInput.value = after;
    txInput.setSelectionRange(0, 0);
  } else {
    lines[lines.length - 1] += after;
    txInput.value = '';
  }
  for (const line of lines) {
    if (!txChar) break;
    const ok = await send(line);
    if (!ok) break;
  }
});

optDir.addEventListener('change', () => {
  terminal.classList.toggle('hide-dir', !optDir.checked);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  currentRxMsg = null;
  lastRxWasCR = false;
  terminal.innerHTML = '';
  syslog('Terminal cleared.');
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.disabled = true;
  btn.addEventListener('click', () => {
    send(btn.dataset.cmd);
  });
});

// ─── Startup ─────────────────────────────────────────────────────────────────
syslog('BLE UART Terminal ready. Click CONNECT to scan for devices.');
syslog('Using Nordic UART Service (NUS) — compatible with most word clock firmware.');
</script>
