<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE UART Terminal</title>
<script>
try {
  const s = JSON.parse(localStorage.getItem('bleUartTerminal.v1') || '{}');
  if (s.theme === 'dark') document.documentElement.classList.remove('light');
} catch (_) {}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  /* ── Dark theme (default) ── */
  :root {
    --bg:        #0e140e;
    --panel:     #141e16;
    --border:    #2e4d2e;
    --accent:    #44ee77;
    --accent-dim:#28c750;
    --accent-glow:#44ee7744;
    --rx-text:   #c4ffd6;
    --tx-color:  #ffeb99;
    --red:       #ff9090;
    --text:      #e8ffe8;
    --text-dim:  #bce4bc;
    --header-bg: linear-gradient(180deg, #162616 0%, #0e140e 100%);
    --scanlines:  1;
    --vignette:   1;
  }

  /* ── Light theme ── */
  :root.light {
    --bg:        #fafafa;
    --panel:     #ffffff;
    --border:    #e0e0e0;
    --accent:    #006622;
    --accent-dim:#004d19;
    --accent-glow:#00662233;
    --rx-text:   #002e0e;
    --tx-color:  #3d1e00;
    --red:       #d61a00;
    --text:      #111111;
    --text-dim:  #383838;
    --header-bg: linear-gradient(180deg, #f0f0f0 0%, #fafafa 100%);
    --scanlines:  0;
    --vignette:   0;
  }

  /* ── Theme toggle switch ── */
  .theme-switch {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    cursor: pointer;
    user-select: none;
  }
  .toggle-track {
    width: 36px; height: 20px;
    border-radius: 10px;
    border: 1px solid var(--accent-dim);
    background: var(--panel);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .toggle-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    top: 2px; left: 2px;
    transition: transform 0.2s, background 0.2s;
  }
  :root.light .toggle-thumb { transform: translateX(16px); background: var(--accent); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanline overlay — hidden in light mode */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 1000;
    opacity: var(--scanlines);
    transition: opacity 0.3s;
  }

  /* CRT vignette — hidden in light mode */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 72%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
    z-index: 999;
    opacity: var(--vignette);
    transition: opacity 0.3s;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-glow);
    letter-spacing: 0.15em;
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.8rem;
    display: block;
    letter-spacing: 0.2em;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.3s;
  }
  .dot.connected {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent), 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  .dot.connecting {
    background: var(--tx-color);
    box-shadow: 0 0 6px var(--tx-color);
    animation: blink 0.5s infinite;
  }
  .dot.error {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  #device-name {
    color: var(--accent);
    text-shadow: 0 0 6px var(--accent-glow);
  }

  main {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 12px 16px;
    gap: 10px;
    overflow: hidden;
  }

  /* Control strip */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  button {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  button:active:not(:disabled)::after { opacity: 0.08; }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #btn-toggle {
    border-color: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  #btn-toggle.connected {
    border-color: #8a2a2a;
    color: #ff7777;
  }
  :root.light #btn-toggle.connected {
    border-color: var(--red);
    color: var(--red);
  }
  #btn-toggle.connected:hover {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 8px rgba(255,50,50,0.3);
  }
  #btn-clear {
    margin-left: auto;
  }

  .separator {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .options {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  select, .options label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  select:focus { outline: none; border-color: var(--accent-dim); }

  .options label {
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .options input[type=checkbox] {
    accent-color: var(--accent);
    width: 15px; height: 15px;
    cursor: pointer;
  }

  /* Terminal output */
  .terminal-wrapper {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .terminal-wrapper::before {
    content: 'OUTPUT';
    position: absolute;
    top: -1px;
    left: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    background: var(--panel);
    padding: 0 6px;
    z-index: 1;
  }

  #terminal {
    height: 100%;
    overflow-y: auto;
    padding: 18px 12px 12px;
    scroll-behavior: smooth;
    font-size: 0.95rem;
    line-height: 1.55;
  }

  #terminal::-webkit-scrollbar { width: 6px; }
  #terminal::-webkit-scrollbar-track { background: var(--bg); }
  #terminal::-webkit-scrollbar-thumb { background: var(--border); }
  #terminal::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

  .line {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 1px 0;
    animation: fadein 0.1s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

  .line .ts {
    color: var(--text-dim);
    font-size: 0.8rem;
    flex-shrink: 0;
    user-select: none;
  }
  .line .ts:empty { display: none; }
  .line .dir {
    font-size: 0.8rem;
    font-weight: bold;
    flex-shrink: 0;
    width: 22px;
    text-align: center;
  }
  #terminal.hide-dir .line .dir { display: none; }
  .line.rx .dir { color: var(--accent); text-shadow: 0 0 6px var(--accent); }
  .line.tx .dir { color: var(--tx-color); text-shadow: 0 0 6px var(--tx-color); }
  .line.sys .dir { color: var(--text-dim); }
  .line.ok .dir { color: var(--accent); text-shadow: 0 0 6px var(--accent); }
  .line .msg { white-space: pre-wrap; word-break: break-word; }
  .line.rx .msg { color: var(--rx-text); text-shadow: 0 0 4px var(--accent-glow); }
  :root.light .line.rx .msg { text-shadow: none; }
  .line.tx .msg, .line .tx-inline { color: var(--tx-color); }
  .line.sys .msg { color: var(--text-dim); font-style: italic; }
  .line.ok {
    margin: 4px 0;
    padding: 4px 8px;
    border-left: 3px solid var(--accent);
    background: rgba(68, 238, 119, 0.08);
  }
  :root.light .line.ok {
    background: rgba(0, 102, 34, 0.08);
  }
  .line.ok .msg {
    color: var(--accent);
    font-weight: bold;
    text-shadow: 0 0 6px var(--accent-glow);
  }
  :root.light .line.ok .msg, :root.light .line.ok .dir {
    text-shadow: none;
  }
  .line.err .msg { color: var(--red); }

  /* Input row */
  .input-row {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 4px 8px;
    align-items: center;
    position: relative;
  }

  .input-row::before {
    content: 'TX';
    font-size: 0.72rem;
    color: var(--tx-color);
    letter-spacing: 0.15em;
    text-shadow: 0 0 6px var(--tx-color);
    flex-shrink: 0;
  }

  #tx-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    color: var(--tx-color);
    caret-color: var(--tx-color);
    padding: 5px;
    letter-spacing: 0.05em;
  }
  #tx-input::placeholder { color: #6a8a6a; }
  #tx-input:disabled { opacity: 0.45; }

  #tx-input:focus ~ .cursor-blink { display: none; }

  #btn-send {
    border-color: #8a6d1a;
    color: var(--tx-color);
    padding: 7px 22px;
  }
  #btn-send:hover:not(:disabled) {
    border-color: var(--tx-color);
    color: var(--tx-color);
    box-shadow: 0 0 8px rgba(255,179,0,0.3);
  }
  :root.light #btn-send:hover:not(:disabled) {
    box-shadow: 0 0 8px rgba(61,30,0,0.2);
  }

  /* Quick-send presets */
  .presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .preset-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    align-self: center;
    text-transform: uppercase;
  }
  .preset-btn {
    font-size: 0.78rem;
    padding: 5px 12px;
    border-color: var(--border);
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    flex-shrink: 0;
    padding: 4px 2px;
  }
  .stats span { color: var(--accent-dim); }

  /* Not-supported message */
  #no-ble {
    display: none;
    text-align: center;
    padding: 40px;
    color: var(--red);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    BLE UART TERMINAL
    <br><a href="https://github.com/ednieuw/HTML-BLEserial" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; font-size: 60%;">EdSoft @2026 V1.2</a>
  </div>
  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">DISCONNECTED</span>
    </div>
    <div class="separator"></div>
    <span id="device-name">—</span>
  </div>
  <div class="theme-switch" id="theme-switch" title="Toggle light/dark">
    ☀
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    ☾
  </div>
</header>

<main>
  <div id="no-ble">⚠ Web Bluetooth not supported in this browser.<br>Use Chrome or Edge on desktop/Android.</div>

  <div class="controls">
    <button id="btn-toggle">⬡ CONNECT</button>
    <button id="btn-reconnect" hidden>↺ RECONNECT</button>
    <div class="separator"></div>
    <div class="options">
      <label><input type="checkbox" id="opt-timestamp"> TIMESTAMP</label>
      <label><input type="checkbox" id="opt-autoscroll" checked> AUTOSCROLL</label>
      <label><input type="checkbox" id="opt-dir"> ARROWS</label>
      <label><input type="checkbox" id="opt-echo"> ECHO</label>
      <select id="opt-newline">
        <option value="crlf">CR+LF</option>
        <option value="lf">LF</option>
        <option value="cr">CR</option>
        <option value="none">NONE</option>
      </select>
      <select id="opt-display">
        <option value="ascii">ASCII</option>
        <option value="hex">HEX</option>
        <option value="both">BOTH</option>
      </select>
    </div>
    <button id="btn-clear">CLR</button>
  </div>

  <div class="presets">
    <span class="preset-label">QUICK:</span>
    <button class="preset-btn" data-cmd="I">INFO</button>
    <button class="preset-btn" data-cmd="T">TIME?</button>
    <button class="preset-btn" data-cmd="S">SYNC</button>
    <button class="preset-btn" data-cmd="R">RESET</button>
    <button class="preset-btn" data-cmd="D">DEBUG</button>
    <button class="preset-btn" data-cmd="H">HELP</button>
  </div>

  <div class="terminal-wrapper">
    <div id="terminal" class="hide-dir"></div>
  </div>

  <div class="input-row">
    <input type="text" id="tx-input" placeholder="type command and press ENTER or SEND…" disabled autocomplete="off" spellcheck="false">
    <button id="btn-send" disabled>SEND ↵</button>
  </div>

  <div class="stats">
    RX: <span id="stat-rx">0</span> bytes &nbsp;|&nbsp;
    TX: <span id="stat-tx">0</span> bytes &nbsp;|&nbsp;
    MSGS: <span id="stat-msgs">0</span> &nbsp;|&nbsp;
    <span id="stat-service">SERVICE: —</span>
  </div>
</main>

<script>
// ─── Nordic UART Service UUIDs ───────────────────────────────────────────────
const UART_SERVICE_UUID     = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_TX_CHAR_UUID     = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // write (host→device)
const UART_RX_CHAR_UUID     = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notify (device→host)

const MAX_TERMINAL_LINES = 10000;
const STORAGE_KEY = 'bleUartTerminal.v1';

// ─── State ───────────────────────────────────────────────────────────────────
let device = null, server = null, txChar = null, rxChar = null;
let rememberedDevice = null;
let sessionDevice = null;
let rxBytes = 0, txBytes = 0, msgCount = 0;
let currentRxMsg = null;
let lastRxWasCR = false;
let rxDecoder = new TextDecoder();
let isConnecting = false;
let txQueue = Promise.resolve();
const history = [];
let histIdx = -1;

// ─── DOM ─────────────────────────────────────────────────────────────────────
const terminal     = document.getElementById('terminal');
const txInput      = document.getElementById('tx-input');
const btnToggle    = document.getElementById('btn-toggle');
const btnReconnect = document.getElementById('btn-reconnect');
const btnSend      = document.getElementById('btn-send');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const deviceName = document.getElementById('device-name');
const statRx     = document.getElementById('stat-rx');
const statTx     = document.getElementById('stat-tx');
const statMsgs   = document.getElementById('stat-msgs');
const statSvc    = document.getElementById('stat-service');
const optTS      = document.getElementById('opt-timestamp');
const optScroll  = document.getElementById('opt-autoscroll');
const optDir     = document.getElementById('opt-dir');
const optEcho    = document.getElementById('opt-echo');
const optNL      = document.getElementById('opt-newline');
const optDisp    = document.getElementById('opt-display');
const noBle      = document.getElementById('no-ble');

// ─── Persistence ─────────────────────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (_) {
    return {};
  }
}

function saveState(extra = {}) {
  try {
    const prev = loadState();
    const state = {
      ...prev,
      theme: document.documentElement.classList.contains('light') ? 'light' : 'dark',
      timestamp: optTS.checked,
      autoscroll: optScroll.checked,
      dir: optDir.checked,
      echo: optEcho.checked,
      newline: optNL.value,
      display: optDisp.value,
      history: history.slice(0, 50),
      ...extra,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (_) {}
}

function restoreState() {
  const s = loadState();
  if (s.theme === 'dark') document.documentElement.classList.remove('light');
  else if (s.theme === 'light') document.documentElement.classList.add('light');

  if (typeof s.timestamp === 'boolean') optTS.checked = s.timestamp;
  if (typeof s.autoscroll === 'boolean') optScroll.checked = s.autoscroll;
  if (typeof s.dir === 'boolean') optDir.checked = s.dir;
  if (typeof s.echo === 'boolean') optEcho.checked = s.echo;
  if (['crlf', 'lf', 'cr', 'none'].includes(s.newline)) optNL.value = s.newline;
  if (['ascii', 'hex', 'both'].includes(s.display)) optDisp.value = s.display;

  terminal.classList.toggle('hide-dir', !optDir.checked);

  if (Array.isArray(s.history)) {
    history.splice(0, history.length, ...s.history.filter(x => typeof x === 'string').slice(0, 50));
  }
}

async function refreshReconnectButton() {
  rememberedDevice = null;
  btnReconnect.hidden = true;
  if (txChar || !navigator.bluetooth) return;
  const { lastDevice } = loadState();
  if (typeof navigator.bluetooth.getDevices === 'function') {
    try {
      const devices = await navigator.bluetooth.getDevices();
      if (devices.length) {
        rememberedDevice = (lastDevice && devices.find(d => d.id === lastDevice.id)) || devices[0];
      }
    } catch (_) {}
  }
  if (!rememberedDevice && sessionDevice) {
    rememberedDevice = sessionDevice;
  }
  if (rememberedDevice) {
    const label = rememberedDevice.name || (lastDevice && lastDevice.name) || 'last device';
    btnReconnect.title = `Reconnect to ${label}`;
    btnReconnect.hidden = false;
  }
  if (!txChar && !isConnecting) {
    if (!btnReconnect.hidden && !btnReconnect.disabled) btnReconnect.focus();
    else if (!btnToggle.disabled) btnToggle.focus();
  }
}

// ─── Check Web Bluetooth ─────────────────────────────────────────────────────
if (!navigator.bluetooth) {
  noBle.style.display = 'block';
  btnToggle.disabled = true;
}

// ─── Logging ─────────────────────────────────────────────────────────────────
function ts() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0')}`;
}

function toHexStr(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}

function log(text, type = 'sys') {
  currentRxMsg = null;
  const line = document.createElement('div');
  line.className = `line ${type}`;

  const tsEl = document.createElement('span');
  tsEl.className = 'ts';
  tsEl.textContent = optTS.checked ? ts() : '';

  const dir = document.createElement('span');
  dir.className = 'dir';
  dir.textContent = type === 'rx' ? '◀' : type === 'tx' ? '▶' : type === 'err' ? '✕' : type === 'ok' ? '✓' : '·';

  const msg = document.createElement('span');
  msg.className = 'msg';
  msg.textContent = text;

  line.append(tsEl, dir, msg);
  terminal.appendChild(line);
  while (terminal.childElementCount > MAX_TERMINAL_LINES) {
    terminal.removeChild(terminal.firstElementChild);
  }
  msgCount++;
  statMsgs.textContent = msgCount;

  if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
  return msg;
}

function syslog(msg) { log(msg, 'sys'); }
function errlog(msg) { log(msg, 'err'); }

// ─── Connect ─────────────────────────────────────────────────────────────────
async function connectToDevice(dev) {
  // Chrome reuses the same BluetoothDevice instance across reconnects; strip any stale listener
  dev.removeEventListener('gattserverdisconnected', onDisconnected);
  device = dev;

  syslog(`Found: ${dev.name || 'Unknown'}`);

  // Windows BLE often drops the first GATT connect or service discovery — retry full setup up to 3x
  let retries = 3;
  while (retries--) {
    try {
      server = await dev.gatt.connect();
      syslog('GATT connected, discovering services…');

      const service = await server.getPrimaryService(UART_SERVICE_UUID);
      statSvc.textContent = `SERVICE: NUS`;

      txChar = await service.getCharacteristic(UART_TX_CHAR_UUID);
      rxChar = await service.getCharacteristic(UART_RX_CHAR_UUID);

      rxChar.removeEventListener('characteristicvaluechanged', onRx);
      await rxChar.startNotifications();
      rxChar.addEventListener('characteristicvaluechanged', onRx);
      break;
    } catch (e) {
      if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
      if (dev.gatt && dev.gatt.connected) {
        dev.gatt.disconnect();
      }
      server = null; txChar = null; rxChar = null;
      if (retries === 0) throw e;
      syslog(`GATT setup failed, retrying… (${retries} left)`);
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  dev.addEventListener('gattserverdisconnected', onDisconnected);
  sessionDevice = dev;
  saveState({ lastDevice: { id: dev.id, name: dev.name || '' } });
  setStatus('connected', dev.name || 'Unknown');
  log(`Connected to [${dev.name || 'Unknown'}] — ready.`, 'ok');
  enableUI(true);
}

async function runConnect(getDevice) {
  if (isConnecting) return;
  isConnecting = true;
  btnToggle.disabled = true;
  btnReconnect.disabled = true;
  try {
    setStatus('connecting');
    const dev = await getDevice();
    await connectToDevice(dev);
  } catch (err) {
    if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
    if (device && device.gatt && device.gatt.connected) {
      device.gatt.disconnect();
    }
    device = null; server = null; txChar = null; rxChar = null;
    statSvc.textContent = 'SERVICE: —';
    setStatus('disconnected');
    enableUI(false);
    if (err.name !== 'NotFoundError') errlog(`Connect failed: ${err.message}`);
    else syslog('Scan cancelled.');
  } finally {
    isConnecting = false;
    btnToggle.disabled = false;
    btnReconnect.disabled = false;
    refreshReconnectButton();
  }
}

function connect() {
  return runConnect(() => {
    syslog('Scanning for BLE UART devices…');
    return navigator.bluetooth.requestDevice({
      filters: [{ services: [UART_SERVICE_UUID] }],
      optionalServices: [UART_SERVICE_UUID],
      // Skip OS pairing dialog where possible
    });
  });
}

function reconnect() {
  if (!rememberedDevice) return;
  const target = rememberedDevice;
  return runConnect(() => {
    syslog(`Reconnecting to [${target.name || 'Unknown'}]…`);
    return Promise.resolve(target);
  });
}

// ─── Disconnect ──────────────────────────────────────────────────────────────
function disconnect() {
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

function onDisconnected(event) {
  if (event && event.target) {
    event.target.removeEventListener('gattserverdisconnected', onDisconnected);
  }
  if (rxChar) rxChar.removeEventListener('characteristicvaluechanged', onRx);
  currentRxMsg = null;
  lastRxWasCR = false;
  rxDecoder = new TextDecoder();
  statSvc.textContent = 'SERVICE: —';
  setStatus('disconnected');
  enableUI(false);
  syslog('Device disconnected.');
  device = null; server = null; txChar = null; rxChar = null;
  refreshReconnectButton();
}

// ─── RX ──────────────────────────────────────────────────────────────────────
function onRx(event) {
  const value = event.target.value;
  const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  rxBytes += bytes.length;
  statRx.textContent = rxBytes;

  const disp = optDisp.value;

  if (disp === 'hex') {
    log(toHexStr(bytes), 'rx');
  } else if (disp === 'both') {
    const text = rxDecoder.decode(bytes, { stream: true });
    log(`${text.replace(/[\r\n]+/g, '↵')}  [${toHexStr(bytes)}]`, 'rx');
  } else {
    let text = rxDecoder.decode(bytes, { stream: true });
    if (lastRxWasCR && text.startsWith('\n')) text = text.slice(1);
    lastRxWasCR = text.endsWith('\r');
    const parts = text.replace(/\r\n?/g, '\n').split('\n');
    parts.forEach((part, idx) => {
      if (idx > 0) {
        if (currentRxMsg === null) log('', 'rx');
        currentRxMsg = null;
      }
      if (part.length) {
        if (currentRxMsg) {
          currentRxMsg.textContent += part;
        } else {
          currentRxMsg = log(part, 'rx');
        }
      }
    });
    if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
  }
}

// ─── TX ──────────────────────────────────────────────────────────────────────
function writeChunk(char, chunk) {
  if (char.properties && char.properties.writeWithoutResponse && !char.properties.write) {
    return char.writeValueWithoutResponse(chunk);
  }
  if (typeof char.writeValueWithResponse === 'function') {
    return char.writeValueWithResponse(chunk);
  }
  return char.writeValue(chunk);
}

function send(text) {
  const run = txQueue.then(() => sendNow(text));
  txQueue = run.catch(() => false);
  return run;
}

async function sendNow(text) {
  if (!txChar) { errlog('Not connected.'); return false; }

  let payload = text;
  if (optNL.value === 'crlf') payload += '\r\n';
  else if (optNL.value === 'lf') payload += '\n';
  else if (optNL.value === 'cr') payload += '\r';
  if (!payload.length) return true;

  const encoded = new TextEncoder().encode(payload);

  let txEl = null;
  let txParent = null;
  if (optEcho.checked) {
    if (text.length) {
      if (currentRxMsg) {
        txParent = currentRxMsg;
        txEl = document.createElement('span');
        txEl.className = 'tx-inline';
        txEl.textContent = text;
        txParent.appendChild(txEl);
        if (optScroll.checked) terminal.scrollTop = terminal.scrollHeight;
      } else {
        txEl = log(text, 'tx').parentElement;
      }
    }
    currentRxMsg = null;
  }

  // Split into 20-byte MTU-safe chunks
  try {
    for (let i = 0; i < encoded.length; i += 20) {
      await writeChunk(txChar, encoded.slice(i, i + 20));
    }
    txBytes += encoded.length;
    statTx.textContent = txBytes;

    // History
    if (text.length && history[0] !== text) history.unshift(text);
    if (history.length > 50) history.pop();
    histIdx = -1;
    saveState();
    return true;
  } catch (err) {
    if (txEl && txEl.parentNode) {
      txEl.parentNode.removeChild(txEl);
      if (!txParent) {
        msgCount--;
        statMsgs.textContent = msgCount;
      }
    }
    errlog(`Send failed: ${err.message}`);
    return false;
  }
}

// ─── UI helpers ─────────────────────────────────────────────────────────────
function setStatus(state, name = '—') {
  statusDot.className = `dot ${state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : ''}`;
  statusText.textContent = state.toUpperCase();
  deviceName.textContent = state === 'connected' ? name : '—';
}

function enableUI(connected) {
  btnToggle.textContent = connected ? '✕ DISCONNECT' : '⬡ CONNECT';
  btnToggle.classList.toggle('connected', connected);
  if (connected) btnReconnect.hidden = true;
  txInput.disabled = !connected;
  btnSend.disabled = !connected;
  document.querySelectorAll('.preset-btn').forEach(b => b.disabled = !connected);
  if (connected) txInput.focus();
  else if (!btnToggle.disabled) btnToggle.focus();
}

// ─── Events ──────────────────────────────────────────────────────────────────
btnToggle.addEventListener('click', () => {
  if (device && device.gatt && device.gatt.connected) disconnect();
  else connect();
});
btnReconnect.addEventListener('click', reconnect);
btnSend.addEventListener('click', () => {
  send(txInput.value);
  txInput.value = '';
});

txInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    send(txInput.value);
    txInput.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) {
      histIdx++;
      txInput.value = history[histIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; txInput.value = history[histIdx]; }
    else if (histIdx === 0) { histIdx = -1; txInput.value = ''; }
  }
});

txInput.addEventListener('paste', async e => {
  const text = e.clipboardData && e.clipboardData.getData('text');
  if (!text || !/[\r\n]/.test(text)) return;
  e.preventDefault();
  if (!txChar) { errlog('Not connected.'); return; }
  const lines = text.split(/\r\n|\n|\r/);
  const hasTrailingNL = lines.length > 1 && lines[lines.length - 1] === '';
  if (hasTrailingNL) lines.pop();
  const start = txInput.selectionStart ?? txInput.value.length;
  const end = txInput.selectionEnd ?? txInput.value.length;
  const before = txInput.value.slice(0, start);
  const after = txInput.value.slice(end);
  lines[0] = before + lines[0];
  if (hasTrailingNL) {
    txInput.value = after;
    txInput.setSelectionRange(0, 0);
  } else {
    lines[lines.length - 1] += after;
    txInput.value = '';
  }
  for (const line of lines) {
    if (!txChar) break;
    const ok = await send(line);
    if (!ok) break;
  }
});

optDir.addEventListener('change', () => {
  terminal.classList.toggle('hide-dir', !optDir.checked);
  saveState();
});
[optTS, optScroll, optEcho, optNL, optDisp].forEach(el => {
  el.addEventListener('change', () => saveState());
});

document.getElementById('btn-clear').addEventListener('click', () => {
  currentRxMsg = null;
  lastRxWasCR = false;
  rxDecoder = new TextDecoder();
  terminal.innerHTML = '';
  syslog('Terminal cleared.');
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.disabled = true;
  btn.addEventListener('click', () => {
    send(btn.dataset.cmd);
  });
});

// ─── Theme toggle ────────────────────────────────────────────────────────────
document.getElementById('theme-switch').addEventListener('click', () => {
  document.documentElement.classList.toggle('light');
  saveState();
});

// ─── Startup ─────────────────────────────────────────────────────────────────
restoreState();
refreshReconnectButton();
syslog('BLE UART Terminal ready. Click CONNECT to scan for devices.');
syslog('Using Nordic UART Service (NUS) — compatible with most word clock firmware.');
</script>
</body>
</html>
